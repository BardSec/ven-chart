version: '3.9'

# ven-chart Development Docker Compose
# Run: docker compose -f docker-compose.dev.yml up -d
# This starts only the database; run Next.js locally with npm run dev

services:
  db:
    image: postgres:16-alpine
    container_name: venchart_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: venchart
      POSTGRES_PASSWORD: venchart_password
      POSTGRES_DB: venchart_db
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U venchart -d venchart_db']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_dev_data:
    name: venchart_postgres_dev_data
